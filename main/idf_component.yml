dependencies:
  # Tracked from main rather than the 1.1.0 release: the release predates the
  # board selection this example relies on. dependencies.lock pins the commit.
  wiznet/wsm_driver:
    git: "https://github.com/Wiznet/wsm_driver.git"
    version: "main"
  # ESP-MQTT. Removed from the ESP-IDF tree in v6.0, so it is a managed
  # component now; the upstream mqtt example depends on it the same way.
  espressif/mqtt: "^1.1.0"
  idf:
    version: ">=6.0.1"
